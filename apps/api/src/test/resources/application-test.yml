
spring:
  datasource:
    url: jdbc:h2:mem:businesslab_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

    hikari:
      maximum-pool-size: 2

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/test-migration
    validate-on-migrate: true
    clean-disabled: true

  session:
    timeout: 12h

    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

management:
  health:
    db:
      enabled: false

businesslab:
  security:
    allowed-origins: http://localhost:3000
