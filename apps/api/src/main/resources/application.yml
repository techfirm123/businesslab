
spring:
  application:
    name: businesslab-api

  datasource:
    url: ${BUSINESSLAB_DB_URL:jdbc:postgresql://localhost:5432/businesslab}
    username: ${BUSINESSLAB_DB_USERNAME:businesslab}
    password: ${BUSINESSLAB_DB_PASSWORD:businesslab-local-only}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: BusinessLab API
    description: Interactive business simulation platform
    version: 0.1.0-SNAPSHOT

businesslab:
  api:
    # Workspace and business endpoints are development-only until
    # authentication and authorization are implemented.
    development-endpoints-enabled: ${BUSINESSLAB_DEV_API_ENABLED:false}
