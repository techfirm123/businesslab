
spring:
  application:
    name: businesslab-api

  datasource:
    url: ${BUSINESSLAB_DB_URL:jdbc:postgresql://localhost:5432/businesslab}
    username: ${BUSINESSLAB_DB_USERNAME:businesslab}
    password: ${BUSINESSLAB_DB_PASSWORD:businesslab-local-only}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false

  session:
    timeout: 12h

    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

  servlet:
    session:
      timeout: 12h
      tracking-modes: cookie

      cookie:
        name: BUSINESSLAB_SESSION
        http-only: true
        secure: ${BUSINESSLAB_SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: BusinessLab API
    description: Interactive business simulation platform
    version: 0.1.0-SNAPSHOT

businesslab:
  api:
    # Additional development-only controller registration guard.
    development-endpoints-enabled: ${BUSINESSLAB_DEV_API_ENABLED:false}

  security:
    # Comma-separated exact origins; credentials cannot use wildcard origins.
    allowed-origins: ${BUSINESSLAB_CORS_ALLOWED_ORIGINS:http://localhost:3000}
